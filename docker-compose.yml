name: ${COMPOSE_PROJECT_NAME:-medsim}

services:
  app:
    image: ${APP_IMAGE:-medsim:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      MONGO_URL: ${DOCKER_MONGO_URL:-mongodb://mongo:27017/medsim?authSource=admin}
      MONGO_USER: ${MONGO_ROOT_USERNAME:?Definir MONGO_ROOT_USERNAME en .env}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD:?Definir MONGO_ROOT_PASSWORD en .env}
      PYTHONUNBUFFERED: "1"
    volumes:
      - unreal_audio:/app/backend/unreal_audio_uploads
    cpus: ${APP_CPUS:-2}
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    stop_grace_period: ${STOP_GRACE_PERIOD:-45s}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILES:-3}"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/api/config_state', timeout=5)"]
      interval: ${APP_HEALTH_INTERVAL:-30s}
      timeout: ${APP_HEALTH_TIMEOUT:-10s}
      retries: ${APP_HEALTH_RETRIES:-3}
      start_period: ${APP_HEALTH_START_PERIOD:-90s}
    networks:
      - medsim_net

  mongo:
    image: ${MONGO_IMAGE:-mongo:8}
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${MONGO_BIND_ADDRESS:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Definir MONGO_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Definir MONGO_ROOT_PASSWORD en .env}
    volumes:
      - mongo_data:/data/db
    cpus: ${MONGO_CPUS:-2}
    mem_limit: ${MONGO_MEMORY_LIMIT:-2g}
    stop_grace_period: ${STOP_GRACE_PERIOD:-45s}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILES:-3}"
    networks:
      - medsim_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ping: 1}).ok !== 1) quit(1)"]
      interval: ${MONGO_HEALTH_INTERVAL:-10s}
      timeout: ${MONGO_HEALTH_TIMEOUT:-10s}
      retries: ${MONGO_HEALTH_RETRIES:-5}
      start_period: ${MONGO_HEALTH_START_PERIOD:-40s}

volumes:
  mongo_data:
  unreal_audio:

networks:
  medsim_net:
    driver: bridge
